services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      MONGODB_DATABASE: navi
      MONGODB_COLLECTION: meetingSummaries
      ROBOT_ID: bracketbot-189
    ports:
      - "8787:8787"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://bracketbot-189.local:8787
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
