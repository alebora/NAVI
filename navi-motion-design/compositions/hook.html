<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Hook — NAVI</title></head><body><template>
<style>
*{box-sizing:border-box}
#root{position:absolute;inset:0;overflow:hidden;background:#000;color:#fff;font-family:Montserrat,sans-serif;-webkit-font-smoothing:antialiased}
.beat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:108px 192px}
.eyebrow{position:absolute;left:192px;top:120px;font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#96999e}
.headline{margin:0;font-weight:700;line-height:1.07;letter-spacing:-.052em;text-align:center}

.word{display:inline-block;clip-path:inset(0 100% 0 0);will-change:transform,clip-path}
.blue{color:#4ea3ff}
.type-lockup{display:flex;align-items:center;justify-content:center;gap:44px}
.glyph{width:116px;height:116px;flex-shrink:0;overflow:visible}
.glyph path,.glyph rect,.glyph circle{fill:none;stroke:#4ea3ff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.glyph .filled{fill:#4ea3ff;stroke:none;fill-opacity:0}
.demo-placeholder{position:absolute;inset:0;background:#090a0c;padding:120px 192px}
.demo-top{display:flex;justify-content:space-between;font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.demo-top .chapter-name{color:#4ea3ff}
.demo-top .placeholder-status{color:#92969c}
.demo-center{position:absolute;left:192px;right:192px;top:420px}
.demo-title{margin:0 0 32px;font-size:132px;line-height:1.04;letter-spacing:-.055em;font-weight:600}
.demo-shot{margin:0;color:#9fa3aa;font-size:30px;line-height:1.4;font-weight:500}
.demo-footer{position:absolute;left:192px;right:192px;bottom:120px;display:flex;justify-content:space-between;color:#777c84;font-size:23px;font-weight:500}

</style>
<div data-hf-id="hf-hk00" id="root" data-composition-id="hook" data-width="1920" data-height="1080" data-duration="5">
<section id="hook-beat-1" class="beat clip" data-start="0" data-duration="2.5" data-track-index="0"><div class="type-lockup"><h1 class="headline" style="font-size:190px"><span class="line"><span class="word" id="hook-w1">Maps</span><span class="word" id="hook-w2">stop</span></span><span class="line"><span class="word" id="hook-w3">at</span><span class="word" id="hook-w4">the</span><span class="word blue" id="hook-w5">door.</span></span></h1></div></section>
<section id="hook-beat-2" class="beat clip" data-start="2.5" data-duration="2.5" data-track-index="0"><div class="type-lockup"><h1 class="headline" style="font-size:170px"><span class="line"><span class="word" id="hook-w6">Inside,</span><span class="word" id="hook-w7">you're</span></span><span class="line"><span class="word" id="hook-w8">on</span><span class="word" id="hook-w9">your</span><span class="word blue" id="hook-w10">own.</span></span></h1></div></section>
</div>
<script>const tl = gsap.timeline({paused:true});
const beats = [{"id":"hook-beat-1","start":0,"duration":2.5,"kind":"rise","times":[0,0.12,0.5,0.6,0.72],"icon":false},{"id":"hook-beat-2","start":2.5,"duration":2.5,"kind":"wipe","times":[0,0.2,0.62,0.72,0.84],"icon":false}];
beats.forEach(beat => {
  const words = gsap.utils.toArray("#" + beat.id + " .word");
  words.forEach((word, i) => {
    const when = beat.start + beat.times[i];
    if (beat.kind === "cut") {
      tl.set(word, {clipPath:"inset(0 0% 0 0)",y:0},when);
    } else {
      tl.fromTo(word,
        {clipPath:beat.kind === "rise" ? "inset(100% 0 0 0)" : "inset(0 100% 0 0)", y:beat.kind === "rise" ? 32 : 0},
        {clipPath:"inset(0 0% 0 0)", y:0, duration:beat.duration < 1.2 ? .2 : .32, ease:"power3.out", immediateRender:false},
        when);
    }
  });
  const glyph = document.querySelector("#" + beat.id + " .glyph");
  if (glyph) {
    glyph.querySelectorAll("path,rect,circle:not(.filled)").forEach((path, i) => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      tl.fromTo(path,{strokeDashoffset:length},{strokeDashoffset:0,duration:.38,ease:"power2.out",immediateRender:false},beat.start+.22+i*.1);
    });
    const dot = glyph.querySelector(".filled");
    if (dot) tl.set(dot,{fillOpacity:1},beat.start+.48);
  }
});
window.__timelines["hook"] = tl;</script>
</template></body></html>
