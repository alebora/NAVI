<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Walking meeting demo, NAVI</title></head><body><template>
<style>
@font-face{font-family:'Lexend';src:url('assets/fonts/lexend.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box}
#root{position:absolute;inset:0;overflow:hidden;background:#000;color:#fff;font-family:Lexend,sans-serif;-webkit-font-smoothing:antialiased}
.demo-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.dm-schematic{position:absolute;inset:0}
.phase{position:absolute;inset:0}
.reveal{display:block;clip-path:inset(0 100% 0 0);padding:.16em .1em .22em;margin:-.16em -.1em -.22em}
.blue{color:#1255CC}
.label{font-size:21px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8a8e95;margin:0 0 10px}
/* transcript that stays while the walk grows underneath it */
.dm-chat{position:absolute;left:192px;right:192px;top:190px}
.dm-quote{margin:0;font-size:60px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.dm-consent{display:flex;align-items:center;gap:20px;font-size:34px;font-weight:600;color:#1255CC;margin:26px 0 0}
.dm-consent svg{width:38px;height:38px;overflow:visible}
.dm-consent path{fill:none;stroke:#1255CC;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.dm-stop{position:absolute;left:192px;top:392px;margin:0;font-size:40px;font-weight:700;letter-spacing:-.018em;color:#b9bcc1}
.dm-rec{position:absolute;right:192px;top:112px;opacity:0;display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;letter-spacing:.08em}
.dm-rec .dot{width:20px;height:20px;border-radius:50%;background:#1255CC}
.dm-wave{position:absolute;left:192px;top:478px;width:1536px;height:150px;overflow:visible;clip-path:inset(0 100% 0 0)}
.dm-wave rect{fill:#1255CC}
.dm-walk{position:absolute;left:192px;top:650px;width:1536px;height:300px;overflow:visible}
.dm-walk .track{stroke:#4a4e55;stroke-width:4;stroke-linecap:round}
.dm-walk .pin{fill:#1255CC}
.dm-walk .pin-stem{stroke:#1255CC;stroke-width:4}
.dm-walk .place{font-family:Lexend,sans-serif;font-size:24px;font-weight:600;letter-spacing:.1em;fill:#8a8e95;text-anchor:middle}
.dm-walk .said{font-family:Lexend,sans-serif;font-size:30px;font-weight:600;fill:#fff;text-anchor:middle}
.dm-walk .person{fill:#8a8e95}
/* summary */
.dm-sum{position:absolute;left:192px;right:192px;top:250px}
.dm-sum h2{margin:0 0 56px;font-size:84px;font-weight:700;letter-spacing:-.028em}
.dm-cols{display:flex;gap:96px}
.dm-col{flex:1}
.dm-item{margin:0 0 30px}
.dm-item .what{display:block;font-size:40px;font-weight:600;letter-spacing:-.018em;margin:0 0 6px}
.dm-item .where{display:block;font-size:24px;font-weight:500;color:#1255CC}
</style>
<div data-hf-id="hf-dm00" id="root" data-composition-id="demo-meeting" data-width="1920" data-height="1080" data-duration="14">
<!-- Schematic stand-in. To use real footage, remove div#demo-meeting-schematic and add the video markup from assets/demo/README.md. -->
<div id="demo-meeting-schematic" class="dm-schematic">

  <section id="dm-phase-1" class="phase clip" data-start="0" data-duration="9.6" data-track-index="0">
    <div class="dm-chat">
      <p class="label reveal">You</p>
      <p class="dm-quote reveal" id="dm-said">“NAVI, record this meeting.”</p>
      <p class="dm-consent reveal" id="dm-consent"><svg viewBox="0 0 44 44"><path d="M6 23 L17 34 L38 10"/></svg>All three said yes. Recording.</p>
    </div>
    <p class="dm-stop reveal" id="dm-stop">“NAVI, stop recording.”</p>
    <div class="dm-rec" id="dm-rec"><span class="dot"></span><span>REC <span id="dm-clock">00:00</span></span></div>
    <svg class="dm-wave" id="dm-wave" viewBox="0 0 1536 150" aria-hidden="true"></svg>
    <svg class="dm-walk" viewBox="0 0 1536 300" aria-hidden="true">
      <line class="track" id="dm-track" x1="0" y1="200" x2="1536" y2="200" opacity="0"/>
      <g id="dm-pin-1" opacity="0"><line class="pin-stem" x1="300" y1="200" x2="300" y2="150"/><circle class="pin" cx="300" cy="140" r="12"/><text class="place" x="300" y="258">HALLWAY B</text><text class="said" x="300" y="100">“Ship the demo by 6.”</text></g>
      <g id="dm-pin-2" opacity="0"><line class="pin-stem" x1="768" y1="200" x2="768" y2="150"/><circle class="pin" cx="768" cy="140" r="12"/><text class="place" x="768" y="258">ATRIUM</text><text class="said" x="768" y="100">“Design owns the video.”</text></g>
      <g id="dm-pin-3" opacity="0"><line class="pin-stem" x1="1236" y1="200" x2="1236" y2="150"/><circle class="pin" cx="1236" cy="140" r="12"/><text class="place" x="1236" y="258">HARDWARE ROOM</text><text class="said" x="1236" y="100">“We need a second reader.”</text></g>
      <g id="dm-group" transform="translate(120 0)" opacity="0">
        <circle class="person" cx="0" cy="200" r="11"/>
        <circle class="person" cx="-30" cy="186" r="11"/>
        <circle class="person" cx="-30" cy="214" r="11"/>
        <circle cx="-86" cy="200" r="24" fill="none" stroke="#1255CC" stroke-width="4"/>
        <circle cx="-86" cy="200" r="13" fill="#fff"/>
      </g>
    </svg>
  </section>

  <section id="dm-phase-2" class="phase clip" data-start="9.6" data-duration="4.4" data-track-index="0">
    <div class="dm-sum">
      <h2 class="reveal" id="dm-sum-title">Meeting notes, <span class="blue">mapped.</span></h2>
      <div class="dm-cols">
        <div class="dm-col">
          <p class="label reveal" id="dm-dec-label">Decisions</p>
          <p class="dm-item" id="dm-item-1"><span class="what reveal">Ship the demo by 6 pm</span><span class="where reveal">Hallway B · 0:04</span></p>
          <p class="dm-item" id="dm-item-2"><span class="what reveal">Design owns the video</span><span class="where reveal">Atrium · 0:09</span></p>
        </div>
        <div class="dm-col">
          <p class="label reveal" id="dm-act-label">Action items</p>
          <p class="dm-item" id="dm-item-3"><span class="what reveal">Get a second NFC reader</span><span class="where reveal">Hardware room · 0:13</span></p>
        </div>
      </div>
    </div>
  </section>

</div>
</div>
<script>const tl = gsap.timeline({paused:true});
const q = s => document.querySelector(s);
const wipe = (sel, at, dur) => tl.fromTo(sel, {clipPath:"inset(0 100% 0 0)"}, {clipPath:"inset(0 0% 0 0)", duration:dur || .35, ease:"power3.out", immediateRender:false}, at);
const wipeAll = (scope, at, gap) => document.querySelectorAll(scope + " .reveal").forEach((el, i) => wipe(el, at + i * gap));

// The request stays on screen; the recording grows underneath it, one continuous beat.
wipeAll(".dm-chat", .2, .5);
const tick = q("#dm-consent path"), tickLen = tick.getTotalLength();
tick.style.strokeDasharray = tickLen; tick.style.strokeDashoffset = tickLen; tick.style.opacity = 0;
tl.fromTo(tick, {opacity:0}, {opacity:1, duration:.01, ease:"none", immediateRender:false}, 1.35);
tl.fromTo(tick, {strokeDashoffset:tickLen}, {strokeDashoffset:0, duration:.3, ease:"power2.out", immediateRender:false}, 1.35);
tl.to("#dm-said", {color:"#b9bcc1", duration:.5, ease:"none"}, 2.0);

// Recording: waveform and the walk share one clock
const wave = q("#dm-wave"), BARS = 96, W = 1536 / BARS;
for (let i = 0; i < BARS; i++) {
  const h = 14 + 112 * Math.abs(Math.sin(i * .83) * Math.cos(i * .31 + 1.2));
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", i * W + 3); r.setAttribute("width", W - 6);
  r.setAttribute("y", 75 - h / 2); r.setAttribute("height", h); r.setAttribute("rx", 3);
  wave.appendChild(r);
}
const T0 = 2.1, WALK = 6.1;
tl.fromTo(["#dm-track", "#dm-group"], {opacity:0}, {opacity:1, duration:.3, ease:"none", immediateRender:false}, T0 - .3);
tl.fromTo("#dm-rec", {opacity:0}, {opacity:1, duration:.3, ease:"none", immediateRender:false}, T0 - .3);
tl.fromTo("#dm-wave", {clipPath:"inset(0 100% 0 0)"}, {clipPath:"inset(0 0% 0 0)", duration:WALK, ease:"none", immediateRender:false}, T0);
tl.fromTo("#dm-group", {x:120}, {x:1440, duration:WALK, ease:"none", immediateRender:false}, T0);
[.18, .48, .8].forEach((f, i) => tl.fromTo("#dm-pin-" + (i + 1), {opacity:0, y:20}, {opacity:1, y:0, duration:.3, ease:"power3.out", immediateRender:false}, T0 + WALK * f));
const clock = {s:0};
tl.fromTo(clock, {s:0}, {s:14, duration:WALK, ease:"none", immediateRender:false,
  onUpdate:() => { q("#dm-clock").textContent = "00:" + String(Math.floor(clock.s)).padStart(2, "0"); }}, T0);
wipe("#dm-stop", T0 + WALK + .1, .4);

// Summary
wipe("#dm-sum-title", 9.75, .45);
wipe("#dm-dec-label", 10.2);
wipeAll("#dm-item-1", 10.4, .12);
wipeAll("#dm-item-2", 10.75, .12);
wipe("#dm-act-label", 11.1);
wipeAll("#dm-item-3", 11.3, .12);

window.__timelines["demo-meeting"] = tl;</script>
</template></body></html>
