<script>const tl = gsap.timeline({paused:true});
const q = s => document.querySelector(s);
const wipe = (sel, at, dur) => tl.fromTo(sel, {clipPath:"inset(0 100% 0 0)"}, {clipPath:"inset(0 0% 0 0)", duration:dur || .35, ease:"power3.out", immediateRender:false}, at);
const wipeAll = (scope, at, gap) => document.querySelectorAll(scope + " .reveal").forEach((el, i) => wipe(el, at + i * gap));

// Phase 1: consent before any capture
wipeAll("#dm-phase-1 .dm-line:nth-child(1)", .2, .12);
wipeAll("#dm-phase-1 .dm-line:nth-child(2)", 1.0, .12);
wipe("#dm-consent", 2.0, .45);
const tick = q("#dm-consent path"), tickLen = tick.getTotalLength();
tick.style.strokeDasharray = tickLen; tick.style.strokeDashoffset = tickLen; tick.style.opacity = 0;
tl.fromTo(tick, {opacity:0}, {opacity:1, duration:.01, ease:"none", immediateRender:false}, 2.1);
tl.fromTo(tick, {strokeDashoffset:tickLen}, {strokeDashoffset:0, duration:.3, ease:"power2.out", immediateRender:false}, 2.1);

// Phase 2: deterministic waveform bars, revealed as the walk progresses
const wave = q("#dm-wave"), BARS = 96, W = 1536 / BARS;
for (let i = 0; i < BARS; i++) {
  const h = 18 + 150 * Math.abs(Math.sin(i * .83) * Math.cos(i * .31 + 1.2));
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", i * W + 3); r.setAttribute("width", W - 6);
  r.setAttribute("y", 100 - h / 2); r.setAttribute("height", h); r.setAttribute("rx", 3);
  wave.appendChild(r);
}
const T0 = 3.2, WALK = 4.4;
tl.fromTo("#dm-wave", {clipPath:"inset(0 100% 0 0)"}, {clipPath:"inset(0 0% 0 0)", duration:WALK, ease:"none", immediateRender:false}, T0 + .2);
tl.fromTo("#dm-group", {x:120}, {x:1440, duration:WALK, ease:"none", immediateRender:false}, T0 + .2);
[.2, .5, .81].forEach((f, i) => tl.fromTo("#dm-pin-" + (i + 1), {opacity:0, y:20}, {opacity:1, y:0, duration:.3, ease:"power3.out", immediateRender:false}, T0 + .2 + WALK * f));
const clock = {s:0};
tl.fromTo(clock, {s:0}, {s:14, duration:WALK, ease:"none", immediateRender:false,
  onUpdate:() => { q("#dm-clock").textContent = "00:" + String(Math.floor(clock.s)).padStart(2, "0"); }}, T0 + .2);
wipe("#dm-stop", T0 + 4.3);

// Phase 3: summary, each item tagged with where it was said
wipe("#dm-sum-title", 8.35, .45);
wipe("#dm-dec-label", 8.8);
wipeAll("#dm-item-1", 9.0, .12);
wipeAll("#dm-item-2", 9.35, .12);
wipe("#dm-act-label", 9.7);
wipeAll("#dm-item-3", 9.9, .12);

window.__timelines["demo-meeting"] = tl;</script>
