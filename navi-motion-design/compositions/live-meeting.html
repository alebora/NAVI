<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Live shot 3, Walking meeting</title></head><body><template>
<style>
@font-face{font-family:'Lexend';src:url('assets/fonts/lexend.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box}
#root{position:absolute;inset:0;overflow:hidden;background:#000;color:#fff;font-family:Lexend,sans-serif;-webkit-font-smoothing:antialiased}
.eyebrow{position:absolute;left:192px;top:120px;font-size:22px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#96999e}
.slot{position:absolute;inset:0;background:#090a0c;padding:120px 192px}
.tag{position:absolute;right:192px;top:120px;font-size:22px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#96999e}
.mid{position:absolute;left:192px;right:192px;top:300px}
.shot-no{margin:0 0 10px;font-size:22px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8a8e95}
h1{margin:0 0 30px;font-size:96px;line-height:1.05;letter-spacing:-.028em;font-weight:700}
.beats{margin:0;padding:0;list-style:none;max-width:1180px}
.beats li{font-size:29px;line-height:1.4;font-weight:500;color:#c6c9ce;margin:0 0 8px;padding-left:38px;position:relative}
.beats li::before{content:"";position:absolute;left:0;top:.62em;width:16px;height:3px;background:#1255CC}
.foot{position:absolute;left:192px;right:192px;bottom:120px;display:flex;justify-content:space-between;color:#777c84;font-size:23px;font-weight:500}
.reveal{display:block;clip-path:inset(0 100% 0 0);padding:.02em .1em .22em;margin:0 -.1em}
</style>
<div id="root" data-composition-id="live-meeting" data-width="1920" data-height="1080" data-duration="16">
<!-- LIVE FOOTAGE SLOT. Remove div#live-meeting-slot and insert the video markup from assets/demo/README.md. -->
<div id="live-meeting-slot" class="slot">
  <div class="mid">
    <p class="shot-no reveal">Shot 3 · 16 seconds · handheld, walking with the group</p>
    <h1 class="reveal">A walking meeting, start to summary.</h1>
    <ul class="beats">
      <li class="reveal">Someone says “NAVI, record this.” NAVI asks for consent; everyone agrees on camera.</li>
      <li class="reveal">Walk and talk: say one real decision and one action item out loud.</li>
      <li class="reveal">NAVI follows the group down the corridor, keeping it in frame.</li>
      <li class="reveal">“NAVI, stop recording.” End on the summary on screen.</li>
      <li class="reveal">Film only people who agreed on camera.</li>
    </ul>
  </div>
  <div class="foot"><span>assets/demo/meeting.mp4 · 1920×1080 · 30fps</span><span>69.5 to 85.5s</span></div>
</div>
</div>
<script>const tl = gsap.timeline({paused:true});
document.querySelectorAll("#live-meeting-slot .reveal").forEach((el, i) => {
  tl.fromTo(el, {clipPath:"inset(0 100% 0 0)"}, {clipPath:"inset(0 0% 0 0)", duration:.35, ease:"power3.out", immediateRender:false}, .2 + i * .3);
});
window.__timelines["live-meeting"] = tl;</script>
</template></body></html>
