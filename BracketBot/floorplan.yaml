    sponsor event room b:   {u: 0.274, v: 0.269}
    sponsor event room c:   {u: 0.376, v: 0.187}
    hacking space floor 2:  {u: 0.686, v: 0.216}
    sponsor bay:            {u: 0.627, v: 0.433}
    project expo:           {u: 0.627, v: 0.464}
    mlh booth:              {u: 0.539, v: 0.161}
