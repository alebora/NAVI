# Where things are ON THE FLOOR PLAN IMAGES, so the robot's SLAM frame can be
# tied to the building and any drawn room becomes a drive target.
#
# All coordinates are normalised image coordinates: u = x / width, v = y / height,
# origin top-left (u = x/15657, v = y/10131), measured off 1.png .. 7.png. They are resolution independent
# and identical on every floor because all seven maps share one footprint.
#
# This file is static annotation. The SLAM<->plan link itself (anchors recorded
# by driving the robot to a landmark) lives in anchors.yaml, written at runtime
# by `floorplan.py anchor`.

images:
  1: 1.png
  2: 2.png
  3: 3.png
  4: 4.png
  5: 5.png
  6: 6.png
  7: 7.png

# Physical features present on every floor at the same spot. Drive the robot to
# one, stand it still, and run `floorplan.py anchor <floor> <landmark>`.
# Two anchors fix a floor; three or more let residuals expose a bad one.
landmarks:
  pse elevators:          {u: 0.589, v: 0.240, hint: "stand in the middle of the PSE elevator lobby, facing the doors"}
  pse female washroom:    {u: 0.618, v: 0.192}
  pse male washroom:      {u: 0.618, v: 0.243}
  pse water fountain:     {u: 0.567, v: 0.343}
  pse stairs northwest:   {u: 0.289, v: 0.102}
  pse stairs southwest:   {u: 0.289, v: 0.346}
  pse stairs south:       {u: 0.598, v: 0.400}
  pse stairs east:        {u: 0.759, v: 0.351}
  e5 elevators:           {u: 0.598, v: 0.627, hint: "middle of the E5 elevator lobby"}
  e5 pse connection:      {u: 0.550, v: 0.522, hint: "middle of the walkway joining the two buildings"}
  e5 exit:                {u: 0.566, v: 0.814}

# Room centres, keyed by the exact `name` used in venue.yaml so voice.py can go
# straight from what someone said to a place on the plan.
rooms:
