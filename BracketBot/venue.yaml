# NAVI venue directory — Hack the North, E5 + PSE (E7), University of Waterloo.
#
# Transcribed from the official floor maps (1.png .. 7.png in this folder).
# This is SEMANTIC knowledge only: it tells people which floor/room a place is
# on. It is NOT a metric map and the planner never reads it. Physical driving
# always goes through places.yaml (SLAM poses saved with `places.py save`).

venue:
  name: Hack the North — E5 + PSE (E7), University of Waterloo
  buildings:
    E5: Engineering 5
    PSE: Pearl Sullivan Engineering (PSE / E7, previously Engineering 7)
  note: >
    E5 and PSE are joined on every floor by the "E5 to PSE (E7) Connection"
    walkway in the middle of the building. Elevators, washrooms and water
    fountains sit next to that connection on both sides of each floor.

floors:
  1: Main entrance, registration, makerspace and hardware
  2: Sponsor bay, organizers, judging rooms A-L
  3: Shopify Inventor's Wing — workshops and hacking space
  4: Federato AI's Hackerhub — workshops and hacking space
  5: Dominion Dynamics Momentum Wing — workshops and hacking space
  6: Trainium Dream Lab — sleeping rooms and mentor lounge
  7: Judging HQ and the multi-faith quiet room

