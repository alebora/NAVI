    sponsor event room b:   {u: 0.177, v: 0.174}
    sponsor event room c:   {u: 0.243, v: 0.121}
    hacking space floor 2:  {u: 0.444, v: 0.140}
    sponsor bay:            {u: 0.406, v: 0.280}
    project expo:           {u: 0.406, v: 0.300}
    mlh booth:              {u: 0.349, v: 0.104}
    judging rooms floor 2:  {u: 0.245, v: 0.224}
    organizer hq:           {u: 0.306, v: 0.396}
